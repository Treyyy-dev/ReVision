name: Web version

# Publishes the game to https://treyyy-dev.github.io/ReVision/ (works on iPhone and any browser).
# One-time setup: repo Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['index.html', 'icon.png', 'web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build site
        run: |
          mkdir -p site
          # index.html has no document head of its own (the Claude page adds one), so add a phone-friendly one
          cat web/head.html index.html > site/index.html
          cp icon.png site/icon.png
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
