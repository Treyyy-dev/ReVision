name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Bundle the game and three.js into the app so it runs offline.
      - name: Copy game into the app
        run: |
          set -e
          A=android/app/src/main/assets
          mkdir -p "$A"
          curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o "$A/three.min.js" \
            || curl -fsSL --retry 3 https://unpkg.com/three@0.128.0/build/three.min.js -o "$A/three.min.js"
          test -s "$A/three.min.js"
          sed 's|https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js|three.min.js|' index.html > "$A/index.html"
          grep -q 'src="three.min.js"' "$A/index.html"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ReVision-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ReVision-apk
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReVision build ${{ github.run_number }}
          body: |
            Android build of ReVision from commit ${{ github.sha }}.
            Download the APK below on your phone and open it to install
            (allow "Install unknown apps" for your browser if Android asks).
          files: dist/*.apk
          make_latest: true
