plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.treyyy.revision'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.treyyy.revision'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // One fixed key for every build, so each new APK installs over the last one.
    // (CI's debug key is random per run, which made Android refuse updates.)
    // Before a Play Store release, move this key out of the repo into a GitHub secret.
    signingConfigs {
        fixed {
            storeFile file('revision.keystore')
            storePassword 'revision123'
            keyAlias 'revision'
            keyPassword 'revision123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
