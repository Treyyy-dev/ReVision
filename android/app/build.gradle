plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.treyyy.revision'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.treyyy.revision'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs by sideloading.
            // Swap in a real release key before publishing to the Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
